<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Rock paper scissors </title>
    <link rel="stylesheet" href="css/styleindex.css">

</head>

<body>
    
    <div id="main"> 

        <header id="header">

            <p class="result" id="round"> Round: 0 </p>

            <p class="result" id="score"> Player: 0     Machine: 0 </p>

            <p id="game"> ? VS ? </p>

            <p class="result" id="message">     </p>

        </header>

        <main id="choices">

            <button class="choice" id="🪨"> <strong>🪨</strong> Rock </button>
            
            <button class="choice" id="📄"> <strong>📄</strong> Paper </button>

            <button class="choice" id="✂️"> <strong>✂️</strong> Scissor </button>

        </main>

    </div>

    <script src="script.js"></script>
</body>

</html>
